[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftqc-patch-rotation"
version = "0.1.0"
description = "Patch-rotation optimizer for transversal Clifford compilation"
requires-python = ">=3.11"
dependencies = [
    "qiskit>=1.1",
    "networkx>=3.2",
    "z3-solver>=4.12",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]
notebook = ["jupyterlab>=4", "nbclient>=0.10", "ipykernel>=6", "nbformat>=5.10"]

[project.scripts]
ftqc-experiment = "ftqc_patch_rotation.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
